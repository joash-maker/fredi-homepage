<script>
  const widget = document.getElementById("widget");
  const widgetToggle = document.getElementById("widgetToggle");
  const closeWidgetBtn = document.getElementById("closeWidgetBtn");
  const openDemoBtn = document.getElementById("openDemoBtn");
  const bookDemoBtn = document.getElementById("bookDemoBtn");

  const teaserBubble = document.getElementById("teaserBubble");
  const teaserClose = document.getElementById("teaserClose");

  const chatBody = document.getElementById("chatBody");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const statusBox = document.getElementById("statusBox");

  const bookingLink = "https://calendar.app.google/qc3wqfpXBVnsQvxq7";
  const widgetStateKey = "mediahubink_fredi_widget_state";
  const teaserDismissedKey = "mediahubink_fredi_teaser_dismissed";

  let teaserShowTimer = null;
  let teaserHideTimer = null;
  let step = 0;
  let isSubmitting = false;
  let chatStarted = false;

  const lead = {
    business: "",
    industry: "",
    painPoints: "",
    name: "",
    email: "",
    phone: "",
    preferredCallback: "",
    source: "Website AI",
    bookingLinkOffered: "Yes",
    transcript: ""
  };

  const INDUSTRY_CONFIG = {
    Trades: {
      keywords: ["plumb", "plumbing", "electric", "electrical", "builder", "building", "joiner", "roofer", "roofing", "heating", "hvac", "gas engineer", "boiler", "trades"],
      label: "Trades",
      intro: "Got it. Trades businesses often deal with missed calls, quote requests, urgent jobs, and after-hours enquiries.",
      question: "What's the biggest pressure point for you right now?",
      quickReplies: ["Missed calls", "Quote requests", "Urgent jobs", "After-hours enquiries"]
    },
    Transport: {
      keywords: ["transport", "logistics", "delivery", "courier", "haulage", "freight", "fleet"],
      label: "Transport",
      intro: "Got it. Transport and logistics businesses often deal with quote requests, urgent bookings, delivery queries, and after-hours messages.",
      question: "What's the biggest pressure point for you right now?",
      quickReplies: ["Quote requests", "Urgent bookings", "Delivery queries", "After-hours messages"]
    },
    Hospitality: {
      keywords: ["restaurant", "cafe", "hotel", "hospitality", "bar", "venue", "guest house", "pub"],
      label: "Hospitality",
      intro: "Got it. Hospitality businesses often deal with booking questions, availability checks, event enquiries, and out-of-hours messages.",
      question: "What's the biggest pressure point for you right now?",
      quickReplies: ["Booking enquiries", "Availability questions", "Event leads", "After-hours messages"]
    },
    Fitness: {
      keywords: ["gym", "fitness", "pt", "personal training", "studio", "wellness"],
      label: "Fitness",
      intro: "Got it. Fitness businesses often deal with membership questions, trial requests, class enquiries, and missed follow-up.",
      question: "What's the biggest pressure point for you right now?",
      quickReplies: ["Membership enquiries", "Trial requests", "Class questions", "Missed follow-up"]
    },
    "Commercial Property": {
      keywords: ["property", "commercial property", "workspace", "office space", "serviced office", "tenant", "leasing", "lease", "viewing"],
      label: "Commercial Property",
      intro: "Got it. Commercial property teams often deal with viewing requests, availability questions, lease enquiries, and out-of-hours interest from potential tenants.",
      question: "What's the biggest pressure point for you right now?",
      quickReplies: ["Viewing requests", "Availability questions", "Lease enquiries", "After-hours interest"]
    },
    School: {
      keywords: ["school", "academy", "college", "education", "nursery"],
      label: "School",
      intro: "Got it. Schools often deal with parent enquiries, admissions questions, visit requests, and admin follow-up.",
      question: "What's the biggest pressure point for you right now?",
      quickReplies: ["Admissions questions", "Parent enquiries", "Visit requests", "Admin overload"]
    },
    Church: {
      keywords: ["church", "ministry", "parish", "fellowship"],
      label: "Church",
      intro: "Got it. Churches often deal with visitor questions, event enquiries, prayer requests, and follow-up after first contact.",
      question: "What's the biggest pressure point for you right now?",
      quickReplies: ["Visitor follow-up", "Event enquiries", "Prayer requests", "Admin overload"]
    },
    Legal: {
      keywords: ["law", "legal", "solicitor", "solicitors", "firm", "attorney"],
      label: "Legal",
      intro: "Got it. Legal firms often deal with new case enquiries, urgent contact requests, consultation bookings, and slow follow-up.",
      question: "What's the biggest pressure point for you right now?",
      quickReplies: ["New case enquiries", "Urgent contact requests", "Consultation bookings", "Slow follow-up"]
    },
    General: {
      keywords: [],
      label: "General",
      intro: "Got it. Businesses often lose strong enquiries because nobody responds quickly enough or the handover is messy.",
      question: "What's the biggest pressure point for you right now when new enquiries come in?",
      quickReplies: ["Missed enquiries", "Slow follow-up", "Admin overload", "After-hours messages"]
    }
  };

  const steps = [
    {
      key: "business",
      ask: "Hi, I'm Fredi.\n\nI help businesses capture and respond to enquiries automatically.\n\nWhat kind of business are you running?",
      quickReplies: [
        "Plumbing business",
        "Transport company",
        "Restaurant",
        "Gym",
        "Commercial property",
        "School",
        "Church",
        "Law firm"
      ],
      validate: (value) => value.trim().length > 1,
      onSave: (value) => {
        const trimmed = value.trim();
        lead.business = trimmed;
        lead.industry = inferIndustry(trimmed);
      }
    },
    {
      key: "painPoints",
      ask: "",
      quickReplies: [],
      validate: (value) => value.trim().length > 2,
      onSave: (value) => {
        lead.painPoints = value.trim();
      }
    },
    {
      key: "name",
      ask: "That helps.\n\nWhat's your full name?",
      quickReplies: [],
      validate: (value) => value.trim().length > 1,
      onSave: (value) => {
        lead.name = value.trim();
      }
    },
    {
      key: "email",
      ask: "Thanks.\n\nWhat's your best email address?",
      quickReplies: [],
      validate: (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim()),
      error: "Please enter a valid email address.",
      onSave: (value) => {
        lead.email = value.trim();
      }
    },
    {
      key: "phone",
      ask: "And what's your phone number?",
      quickReplies: [],
      validate: (value) => value.replace(/[^\d+]/g, "").length >= 7,
      error: "Please enter a valid phone number.",
      onSave: (value) => {
        lead.phone = value.trim();
      }
    },
    {
      key: "preferredCallback",
      ask: "When would you like a response?",
      quickReplies: ["As soon as possible", "Today", "This week"],
      validate: (value) => value.trim().length > 1,
      onSave: (value) => {
        lead.preferredCallback = value.trim();
      }
    }
  ];

  function inferIndustry(value) {
    const text = value.toLowerCase();

    for (const [industryName, config] of Object.entries(INDUSTRY_CONFIG)) {
      if (industryName === "General") continue;
      const hasMatch = config.keywords.some((keyword) => text.includes(keyword));
      if (hasMatch) return config.label;
    }

    return "General";
  }

  function getIndustryConfig(industry) {
    return INDUSTRY_CONFIG[industry] || INDUSTRY_CONFIG.General;
  }

  function escapeHtml(str = "") {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function appendMessage(text, type = "bot") {
    const message = document.createElement("div");
    message.className = `msg ${type}`;
    message.textContent = text;
    chatBody.appendChild(message);
    chatBody.scrollTop = chatBody.scrollHeight;
    updateTranscript(type, text);
  }

  function appendQuickReplies(options) {
    if (!options || !options.length) return;

    const row = document.createElement("div");
    row.className = "quick-replies";

    options.forEach((option) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "quick-reply-btn";
      btn.textContent = option;
      btn.addEventListener("click", () => {
        if (isSubmitting) return;
        chatInput.value = option;
        handleSend();
      });
      row.appendChild(btn);
    });

    chatBody.appendChild(row);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function updateTranscript(type, text) {
    const prefix = type === "user" ? "Lead" : "Fredi";
    lead.transcript += `${prefix}: ${text}\n`;
  }

  function showTyping() {
    hideTyping();

    const typing = document.createElement("div");
    typing.className = "typing-row";
    typing.id = "typingRow";
    typing.innerHTML = `
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
      <span>Fredi is typing...</span>
    `;

    chatBody.appendChild(typing);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function hideTyping() {
    const typing = document.getElementById("typingRow");
    if (typing) typing.remove();
  }

  function getCurrentStepPrompt() {
    const current = steps[step];
    if (!current) return { text: "", replies: [] };

    if (current.key === "painPoints") {
      const config = getIndustryConfig(lead.industry);
      return {
        text: `${config.intro}\n\n${config.question}`,
        replies: config.quickReplies
      };
    }

    return {
      text: current.ask,
      replies: current.quickReplies || []
    };
  }

  function askCurrentStep() {
    const current = steps[step];
    if (!current) return;

    const prompt = getCurrentStepPrompt();

    showTyping();
    setTimeout(() => {
      hideTyping();
      appendMessage(prompt.text, "bot");
      appendQuickReplies(prompt.replies);
    }, 450);
  }

  function resetLead() {
    lead.business = "";
    lead.industry = "";
    lead.painPoints = "";
    lead.name = "";
    lead.email = "";
    lead.phone = "";
    lead.preferredCallback = "";
    lead.source = "Website AI";
    lead.bookingLinkOffered = "Yes";
    lead.transcript = "";
  }

  function resetChat() {
    chatBody.innerHTML = "";
    statusBox.style.display = "none";
    statusBox.innerHTML = "";
    chatInput.value = "";
    chatInput.disabled = false;
    sendBtn.disabled = false;

    resetLead();
    step = 0;
    isSubmitting = false;
    chatStarted = true;

    askCurrentStep();
  }

  async function handleSend() {
    if (isSubmitting) return;

    const value = chatInput.value.trim();
    if (!value) return;

    const current = steps[step];
    if (!current) return;

    if (!current.validate(value)) {
      appendMessage(current.error || "Please enter a valid response.", "bot");
      return;
    }

    appendMessage(value, "user");
    current.onSave(value);
    chatInput.value = "";

    step += 1;

    if (step < steps.length) {
      askCurrentStep();
      return;
    }

    await submitLead();
  }

  async function submitLead() {
    isSubmitting = true;
    chatInput.disabled = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(lead)
      });

      const data = await response.json();
      hideTyping();

      if (!response.ok) {
        throw new Error(data.error || "Something went wrong.");
      }

      appendMessage(
        `Thanks, ${lead.name}.\n\nYour enquiry has been captured and passed on.\n\nIf you'd like, you can also book a demo here:\n${bookingLink}`,
        "bot"
      );

      statusBox.style.display = "block";
      statusBox.innerHTML = `
        <h3>Lead captured</h3>
        <p>Your enquiry has been sent successfully.</p>
        <p><strong>Industry:</strong> ${escapeHtml(lead.industry)}</p>
        <p><strong>Booking link:</strong><br><a href="${escapeHtml(bookingLink)}" target="_blank" rel="noopener noreferrer">${escapeHtml(bookingLink)}</a></p>
      `;
    } catch (error) {
      hideTyping();
      appendMessage("Sorry, something went wrong while sending your enquiry. Please try again.", "bot");
      statusBox.style.display = "block";
      statusBox.innerHTML = `
        <h3>Submission issue</h3>
        <p>${escapeHtml(error.message)}</p>
      `;
    } finally {
      isSubmitting = false;
      chatInput.disabled = false;
      sendBtn.disabled = false;
    }
  }

  function openWidget() {
    widget.classList.add("open");
    localStorage.setItem(widgetStateKey, "open");
    hideTeaser();

    if (!chatStarted) {
      resetChat();
    }

    setTimeout(() => {
      chatInput.focus();
    }, 150);
  }

  function closeWidget() {
    widget.classList.remove("open");
    localStorage.setItem(widgetStateKey, "closed");
  }

  function showTeaser() {
    if (localStorage.getItem(teaserDismissedKey) === "true") return;
    if (widget.classList.contains("open")) return;
    teaserBubble.classList.add("show");
  }

  function hideTeaser() {
    teaserBubble.classList.remove("show");
  }

  widgetToggle.addEventListener("click", () => {
    if (widget.classList.contains("open")) {
      closeWidget();
    } else {
      openWidget();
    }
  });

  closeWidgetBtn.addEventListener("click", closeWidget);
  openDemoBtn.addEventListener("click", openWidget);
  bookDemoBtn.addEventListener("click", openWidget);
  sendBtn.addEventListener("click", handleSend);

  chatInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      handleSend();
    }
  });

  teaserClose.addEventListener("click", () => {
    hideTeaser();
    localStorage.setItem(teaserDismissedKey, "true");
  });

  window.addEventListener("load", () => {
    const widgetState = localStorage.getItem(widgetStateKey);

    if (widgetState === "open") {
      openWidget();
    } else {
      teaserShowTimer = setTimeout(showTeaser, 1800);
      teaserHideTimer = setTimeout(hideTeaser, 9000);
    }
  });
</script>
